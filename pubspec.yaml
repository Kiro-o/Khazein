name: khazeen_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.10.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.4
  firebase_storage: ^13.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  cached_network_image_platform_interface: ^4.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.3.0
  mock_exceptions: ^0.8.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    # Small in-app logo. assets/icon/app_icon.png is only the source for
    # flutter_launcher_icons, so it is not bundled.
    - assets/images/logo.png
    - assets/fonts/OFL.txt

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
